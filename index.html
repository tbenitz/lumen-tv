<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen TV</title>
  <link rel="stylesheet" href="css/app.css?v=5" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div class="brand-name">Lumen TV</div>
          <div class="brand-sub">Public streams</div>
        </div>
      </div>
      <label class="search"><input id="listSearch" type="search" placeholder="Filter lists..." autocomplete="off" /></label>
      <nav class="lists" id="listNav"></nav>
      <div class="rail-foot">
        <button class="ghost" id="customBtn" type="button">Load custom M3U</button>
        <button class="ghost" id="helpBtn" type="button">Shortcuts</button>
      </div>
    </aside>
    <main class="stage" id="stage">
      <header class="topbar">
        <button class="icon-btn" id="toggleRail" type="button">Hide lists</button>
        <button class="icon-btn" id="toggleGuide" type="button">Hide channels</button>
        <div class="now">
          <span class="live-dot" id="liveDot"></span>
          <div>
            <div class="now-kicker" id="nowList">Featured</div>
            <div class="now-title" id="nowTitle">Select a channel</div>
          </div>
        </div>
        <div class="top-actions">
          <span class="check-pill" id="checkStatus"></span>
          <button class="chip" id="checkBtn" type="button">Check feeds</button>
          <button class="chip" id="favFilterBtn" type="button">Favorites</button>
          <button class="chip" id="sortBtn" type="button">Popular first</button>
        </div>
      </header>
      <section class="theater" id="theater">
        <div class="player-shell">
          <video id="mainVideo" playsinline></video>
          <div class="poster-veil" id="veil">
            <div class="veil-mark">LUMEN</div>
            <p>Last session resumes automatically. Check feeds about once a week.</p>
          </div>
          <div class="osd">
            <div class="osd-left">
              <button class="ctrl" id="playBtn" type="button">Play</button>
              <button class="ctrl" id="muteMain" type="button">Mute</button>
              <input id="volMain" class="vol" type="range" min="0" max="1" step="0.01" value="1" />
              <span class="vol-label" id="volMainLbl">100%</span>
            </div>
            <div class="osd-right">
              <button class="ctrl" id="pip1FromMain" type="button">PIP 1</button>
              <button class="ctrl" id="pip2FromMain" type="button">PIP 2</button>
              <button class="ctrl" id="fsBtn" type="button">Full</button>
            </div>
          </div>
          <div class="status" id="status"></div>
        </div>
        <article class="pip" id="pip1" hidden>
          <header class="pip-bar"><span class="pip-tag">PIP 1</span><span class="pip-name" id="pip1Name">Empty</span>
            <div class="pip-tools"><button class="mini" data-swap="1" type="button">Swap</button><button class="mini" data-close="1" type="button">X</button></div>
          </header>
          <video id="pip1Video" playsinline></video>
          <footer class="pip-audio"><button class="mini" id="mutePip1" type="button">Unmute</button><input id="volPip1" class="vol" type="range" min="0" max="1" step="0.01" value="0.6" /></footer>
          <div class="resize" data-resize="1"></div>
        </article>
        <article class="pip" id="pip2" hidden>
          <header class="pip-bar"><span class="pip-tag">PIP 2</span><span class="pip-name" id="pip2Name">Empty</span>
            <div class="pip-tools"><button class="mini" data-swap="2" type="button">Swap</button><button class="mini" data-close="2" type="button">X</button></div>
          </header>
          <video id="pip2Video" playsinline></video>
          <footer class="pip-audio"><button class="mini" id="mutePip2" type="button">Unmute</button><input id="volPip2" class="vol" type="range" min="0" max="1" step="0.01" value="0.6" /></footer>
          <div class="resize" data-resize="2"></div>
        </article>
      </section>
      <section class="guide">
        <div class="guide-head">
          <label class="search wide"><input id="channelSearch" type="search" placeholder="Search channels..." autocomplete="off" /></label>
          <div class="count" id="channelCount">0 live</div>
        </div>
        <div class="channels" id="channels"></div>
      </section>
    </main>
  </div>
  <dialog id="modal">
    <form method="dialog" class="sheet">
      <h2 id="modalTitle">Load custom list</h2>
      <p class="hint" id="modalHint">Paste a public M3U URL.</p>
      <input id="customUrl" type="url" placeholder="https://example.com/playlist.m3u" />
      <menu><button value="cancel">Close</button><button id="modalOk" value="ok">Load</button></menu>
      <pre class="keys" id="keys" hidden></pre>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script src="data/playlists.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
